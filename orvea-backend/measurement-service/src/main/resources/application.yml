server:
  port: 8090

spring:
  application:
    name: measurement-service
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:3306/hms_measurement?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
  servlet:
    multipart:
      max-file-size: 6MB
      max-request-size: 6MB
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_USER:eureka}:${EUREKA_PASSWORD:eureka123}@${EUREKA_HOST:localhost}:8761/eureka/
  instance:
    prefer-ip-address: true

physio:
  timezone: ${CLINIC_TZ:Asia/Kolkata}
  measurement:
    storage-dir: ${MEASUREMENT_STORAGE_DIR:./data/measurement-photos}
    max-image-bytes: 5242880
    require-camera-consent: true
    reminder-cron: "0 0 8-20 * * *"      # hourly between 08:00 and 20:00 clinic time; a marker prevents repeats

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics