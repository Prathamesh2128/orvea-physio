server:
  port: 8001

# --- ADD THIS LOGGING BLOCK HERE ---
logging:
  level:
    org.springframework.security: DEBUG
# -----------------------------------

spring:
  application:
    name: auth-service

  datasource:
     url: jdbc:mysql://${DB_HOST:localhost}:3306/hms_auth?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
     username: ${DB_USER:root}
     password: ${DB_PASS:pgdac}
     driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update  # switch to Flyway migrations before production
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

physio:
  jwt:
    secret: ${JWT_SECRET:cGh5c2lvLWhtcy1zdXBlci1zZWNyZXQta2V5LWNoYW5nZS1pbi1wcm9kdWN0aW9uLTI1Ng==}
    issuer: physio-hms
    access-token-expiry-ms: 900000
    refresh-token-expory-ms: 604800000
  bootstrap:
    admin:
      username: ${BOOTSTRAP_ADMIN_USER:superadmin}
      email: ${BOOTSTRAP_ADMIN_EMAIL:superadmin@physio.local}
      password: ${BOOTSTRAP_ADMIN_PASSWORD:ChangeMe@123}


eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_USER:eureka}:${EUREKA_PASSWORD:eureka123}@${EUREKA_HOST:localhost}:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics